name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  PROJECT_ZIP: ImageDiff.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 解压工程
        run: |
          set -e
          ls -la
          mkdir -p project
          unzip -o "$PROJECT_ZIP" -d project
          test -f project/settings.gradle.kts
          ls project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: 编译
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 校验产物
        run: |
          ls -lh project/app/build/outputs/apk/debug/
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
